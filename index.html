<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="123.NET Phone Configuration Generator - Create and manage Polycom and Yealink phone configurations, MikroTik templates, and network switch configurations." />
    <meta name="keywords" content="Polycom, Yealink, phone configuration, MikroTik, network switch, VoIP, SIP, phone management" />
    <meta name="author" content="123.NET" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- CSS preload hint -->
    <link rel="preload" href="/src/styles/App.css" as="style" />
    
    <!-- Title -->
    <title>123.NET - Phone Configuration Generator</title>
    
    <!-- Inline critical CSS for loading screen -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: #f8f9fa;
        color: #212529;
        line-height: 1.6;
      }
      
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #3182ce 0%, #17a2b8 100%);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
      }
      
      .loading-content {
        text-align: center;
        color: white;
        padding: 2rem;
      }
      
      .loading-logo {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      
      .logo-block {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        margin: 0 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        color: white;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      .logo-block:nth-child(1) {
        background: #e53e3e;
        animation-delay: 0s;
      }
      
      .logo-block:nth-child(2) {
        background: #38a169;
        animation-delay: 0.2s;
      }
      
      .logo-block:nth-child(3) {
        background: #3182ce;
        animation-delay: 0.4s;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      
      .loading-text {
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
        opacity: 0.9;
      }
      
      .loading-subtext {
        font-size: 0.9rem;
        opacity: 0.7;
      }
      
      .error-container {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 8px;
        padding: 1.5rem;
        margin: 1rem;
        color: #721c24;
        display: none;
      }
      
      .error-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      
      .error-message {
        font-size: 0.9rem;
        line-height: 1.4;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.1); }
      }
      
      @media (max-width: 768px) {
        .loading-content {
          padding: 1rem;
        }
        
        .logo-block {
          width: 32px;
          height: 32px;
          font-size: 1.2rem;
        }
        
        .loading-text {
          font-size: 1rem;
        }
        
        .loading-subtext {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading screen -->
      <div class="loading-container" id="loadingScreen">
        <div class="loading-content">
          <div class="loading-logo">
            <div class="logo-block">1</div>
            <div class="logo-block">2</div>
            <div class="logo-block">3</div>
          </div>
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading 123.NET Configuration Manager</div>
          <div class="loading-subtext">Please wait while we initialize the application...</div>
        </div>
      </div>
      
      <!-- Error fallback -->
      <div class="error-container" id="errorContainer">
        <div class="error-title">Application Error</div>
        <div class="error-message">
          The application failed to load. Please try refreshing the page or contact support if the problem persists.
        </div>
      </div>
    </div>
    
    <!-- Error handling script -->
    <script>
      // Hide loading screen after a timeout
      setTimeout(() => {
        const loadingScreen = document.getElementById('loadingScreen');
        const errorContainer = document.getElementById('errorContainer');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          loadingScreen.style.display = 'none';
          errorContainer.style.display = 'block';
        }
      }, 10000); // 10 second timeout
      
      // Global error handler
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
        const loadingScreen = document.getElementById('loadingScreen');
        const errorContainer = document.getElementById('errorContainer');
        if (loadingScreen) loadingScreen.style.display = 'none';
        if (errorContainer) errorContainer.style.display = 'block';
      });
      
      // Unhandled promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
        const loadingScreen = document.getElementById('loadingScreen');
        const errorContainer = document.getElementById('errorContainer');
        if (loadingScreen) loadingScreen.style.display = 'none';
        if (errorContainer) errorContainer.style.display = 'block';
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
